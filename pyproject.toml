[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "chongzu"
version = "0.1.0.dev0"
description = "Relocatable Windows research table and text organization workbench"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary - project-specific research tooling" }
authors = [
  { name = "ChongZu project" },
]
dependencies = [
    "duckdb==1.5.5",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
default-groups = ["dev"]
