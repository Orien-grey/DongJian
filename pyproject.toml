[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "chongzu"
version = "0.1.0.dev0"
description = "Relocatable Windows research table and text organization workbench"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary - project-specific research tooling" }
authors = [
  { name = "ChongZu project" },
]
dependencies = [
    "duckdb==1.5.5",
    "polars==1.44.1",
    "python-calamine==0.8.2",
    "PyMuPDF==1.28.2",
    "img2table==2.0.0",
    "rapidocr==3.9.2",
    "onnxruntime==1.29.0",
    # RapidOCR 3.9.2 works with this wheel-only OmegaConf line on Windows;
    # 2.3.x adds an antlr runtime that is not required by the OCR path.
    "omegaconf==2.0.6",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
default-groups = ["dev"]
